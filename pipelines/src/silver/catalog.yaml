# Catálogo de tags: o que cada nó OPC UA significa na silver (docs/silver-contract.md, secção 3).
# Gerado a partir de ot/gateway/src/ot_gateway/devices.yaml; um teste compara as duas fontes.
# kind: analog (double) | counter (inteiro) | state (código + etiqueta) | boolean | clock (instante do dispositivo)
# moves_with_run: true = com o ativo parado o valor fica constante (quase sempre 0) e deixa de gerar amostras (o
#   gateway só escreve ao mudar); o G2-06 não o confunde com um sensor preso. Espelha os `idle` sem `tau_s` do simulador (há um teste).
tags:
  - {node_id: "ns=2;s=PUMP-01.Connected", asset: PUMP-01, tag: Connected, kind: boolean}
  - {node_id: "ns=2;s=PUMP-01.outlet_pressure", asset: PUMP-01, tag: outlet_pressure, kind: analog, unit: BAR, eu_min: 0.0, eu_max: 16.0, moves_with_run: true}
  - {node_id: "ns=2;s=PUMP-01.flow_rate", asset: PUMP-01, tag: flow_rate, kind: analog, unit: MQH, eu_min: 0.0, eu_max: 500.0, moves_with_run: true}
