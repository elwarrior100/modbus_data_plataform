[project]
name = "ot-gateway"
version = "0.1.0"
description = "Gateway Modbus (RTU/TCP) para OPC UA"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.1.0",
    "pymodbus>=3.16.1",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
ot-gateway = "ot_gateway.main:main"

[dependency-groups]
dev = [
    "ot-simulator",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ot_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
ot-simulator = { path = "../simulator" }
