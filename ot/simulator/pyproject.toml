[project]
name = "ot-simulator"
version = "0.1.0"
description = "Simulador Modbus RTU (RS-232) e TCP de três ativos industriais"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
]

[project.scripts]
ot-simulator = "ot_simulator.main:main"

[dependency-groups]
dev = [
    "pymodbus>=3.16.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ot_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
