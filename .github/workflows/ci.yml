# Tests every push; on main, also builds the three images, scans them (Trivy) and publishes them to GHCR with SBOM and
# provenance, tagged with the commit SHA. Actions are pinned by commit SHA (Dependabot keeps them current).
# Runs natively on arm64 (the Mac VM and the Oracle VM are both arm64), so no emulation is needed.
# Deploying is not done here: the tag is set in the platform repository and Argo CD applies it (ADR-010).
name: ci

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        project: [ingest, pipelines, ot/simulator, ot/gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: pytest
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q   # tests that need a real lakeFS skip themselves without credentials

  image:
    name: image (${{ matrix.image }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: ingest, context: ingest}
          - {image: ot-edge, context: ot}
          - {image: pipelines, context: pipelines}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1. build and load locally (native arm64), 2. scan, 3. push only if the scan passes
      - name: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/modbus-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: scan (fails on CRITICAL vulnerabilities that have a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/modbus-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: push (with SBOM and provenance attestations)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/modbus-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
