# Tests every push; on main, also builds the three images and publishes them to GHCR, tagged with the commit SHA.
# Runs natively on arm64 (the Mac VM and the Oracle VM are both arm64), so no emulation is needed.
# Deploying is not done here: the tag is set in the platform repository and Argo CD applies it (ADR-010).
name: ci

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        project: [ingest, pipelines, ot/simulator, ot/gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q   # tests that need a real lakeFS skip themselves without credentials

  image:
    name: image (${{ matrix.image }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: ingest, context: ingest}
          - {image: ot-edge, context: ot}
          - {image: pipelines, context: pipelines}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/modbus-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
