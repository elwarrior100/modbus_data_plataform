[project]
name = "ingest"
version = "0.1.0"
description = "Collector OPC UA, spool durável e writer do bronze no lakeFS"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.1.0",
    "lakefs>=0.16.0",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
ingest = "ingest.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["lakefs: precisa do lakeFS real (LAKEFS_ENDPOINT)"]
