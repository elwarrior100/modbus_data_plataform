<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Promessa 2: não guardar a mesma leitura duas vezes</title>
<rect width="800" height="420" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Promessa 2: não guardar a mesma leitura duas vezes</text>
<rect x="20" y="56" width="230" height="180" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
<text x="135.0" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">Leitura A</text>
<text x="135.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">5,07 bar</text>
<text x="135.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">às 16:06:15</text>
<text x="135.0" y="206" text-anchor="middle" font-size="12" fill="#0c447c">impressão digital: 979a…</text>
<rect x="285" y="56" width="230" height="180" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
<text x="400.0" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">A mesma leitura</text>
<text x="400.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">chega outra vez</text>
<text x="400.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">(o carteiro reconectou)</text>
<text x="400.0" y="206" text-anchor="middle" font-size="12" fill="#0c447c">impressão digital: 979a…</text>
<rect x="550" y="56" width="230" height="180" rx="12" fill="#eaf3de" stroke="#3b6d11" stroke-width="1.5"/>
<text x="665.0" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">O caderno diz:</text>
<text x="665.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">"já tenho esta"</text>
<text x="665.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">e não a escreve</text>
<text x="665.0" y="206" text-anchor="middle" font-size="12" fill="#27500a">INSERT OR IGNORE</text>
<path d="M252 146 H283" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M517 146 H548" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<text x="400" y="280" font-size="13.5" fill="#2c2c2a" text-anchor="middle" font-weight="bold">A impressão digital (event_id) faz-se a partir do que a leitura DIZ:</text>
<text x="400" y="304" font-size="13.5" fill="#2c2c2a" text-anchor="middle">de onde veio, o sensor, a hora do sensor, o estado e o valor.</text>
<text x="400" y="336" font-size="12.5" fill="#444" text-anchor="middle">Não entra a hora a que o carteiro a recebeu. Por isso a repetida tem a MESMA impressão digital.</text>
<text x="400" y="362" font-size="12.5" fill="#0c447c" text-anchor="middle">No código: make_event_id em envelope.py (linha 24) e a coluna UNIQUE em spool.py.</text>
</svg>
