<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 688" width="800" height="688" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="688" fill="#ffffff"/>
<text x="30" y="26" font-weight="bold" font-size="15" fill="#2c2c2a">Device.step(): o que acontece a cada 100 ms, por dispositivo</text>
<rect x="30" y="50" width="640" height="72" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="46" y="74" font-weight="bold" fill="#633806">1. Que cenários estão ativos para mim?</text>
<text x="46" y="94" font-size="12" fill="#633806">engine.active(nome, agora)  ·  se um cenário é novo, corre _on_start</text>
<path d="M350 122V148" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="148" width="640" height="72" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="46" y="172" font-weight="bold" fill="#633806">2. Respondo ou estou calado?</text>
<text x="46" y="192" font-size="12" fill="#633806">online = não há comms_gap nem power_cycle ativo</text>
<text x="46" y="211" font-size="12" font-family="Menlo, Consolas, monospace" fill="#633806">comms_gap: handle_pdu devolve None</text>
<path d="M350 220V246" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="246" width="640" height="72" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="46" y="270" font-weight="bold" fill="#27500a">3. Qual é o meu estado?</text>
<text x="46" y="290" font-size="12" fill="#27500a">RUNNING, STARTING ou FAULT (o drift chegou ao fim da rampa?)</text>
<path d="M350 318V344" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="344" width="640" height="72" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="46" y="368" font-weight="bold" fill="#27500a">4. Para cada sinal: chegou o seu scan?</text>
<text x="46" y="388" font-size="12" fill="#27500a">não: salta e o registo mantém o valor antigo</text>
<text x="46" y="407" font-size="12" font-family="Menlo, Consolas, monospace" fill="#27500a">sim: valor = nominal + ruído + drift  (stuck não escreve, spike substitui)</text>
<path d="M350 416V442" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="442" width="640" height="72" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="46" y="466" font-weight="bold" fill="#0c447c">5. Escrever no registo  _write()</text>
<text x="46" y="486" font-size="12" fill="#0c447c">to_raw (divide pela escala) &gt; encode (ordem das palavras) &gt; device.holding</text>
<text x="46" y="505" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0c447c">é aqui que 5.07 bar vira o inteiro 507</text>
<path d="M350 514V540" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="540" width="640" height="72" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="46" y="564" font-weight="bold" fill="#0c447c">6. Avaliar o alarme</text>
<text x="46" y="584" font-size="12" fill="#0c447c">histerese: liga a 12 mm/s e só desliga abaixo de 10 &gt; device.coils[0]</text>
<path d="M670 576H710V86H672" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="720" y="331" font-size="11" fill="#444">repete</text><text x="720" y="345" font-size="11" fill="#444">a cada</text><text x="720" y="359" font-size="11" fill="#444">100 ms</text>
<text x="30" y="676" font-size="11" fill="#444">Cores: amarelo = cenários, verde = lógica do dispositivo, azul = escrita e alarme.</text>
</svg>
