<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 724" width="800" height="724" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Onde isto pode melhorar: os pontos fracos, por ordem de gravidade</title>
<rect width="800" height="724" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Onde isto pode melhorar: os pontos fracos, por ordem de gravidade</text>
<text x="20" y="56" font-size="12" fill="#444" text-anchor="start" font-weight="bold">PONTO FRACO</text>
<text x="250" y="56" font-size="12" fill="#444" text-anchor="start" font-weight="bold">PORQUE IMPORTA</text>
<text x="560" y="56" font-size="12" fill="#444" text-anchor="start" font-weight="bold">COMO MELHORAR</text>
<rect x="20" y="66" width="760" height="56" rx="8" fill="#fcebeb" stroke="#a32d2d"/>
<text x="32" y="99" font-size="12.5" font-weight="bold" fill="#791f1f">Perda com o collector parado</text>
<text x="250" y="90" font-size="12" fill="#791f1f">o OPC UA não guarda histórico: o que</text>
<text x="250" y="108" font-size="12" fill="#791f1f">muda enquanto está em baixo perde-se</text>
<text x="560" y="90" font-size="12" fill="#791f1f">buffer no gateway, ou 2 réplicas</text>
<text x="560" y="108" font-size="12" fill="#791f1f"></text>
<rect x="20" y="132" width="760" height="56" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="32" y="165" font-size="12.5" font-weight="bold" fill="#633806">Um lote mau trava os bons</text>
<text x="250" y="156" font-size="12" fill="#633806">o G1 rejeita o lote todo; as amostras</text>
<text x="250" y="174" font-size="12" fill="#633806">boas ficam em quarentena</text>
<text x="560" y="156" font-size="12" fill="#633806">isolar só as linhas más</text>
<text x="560" y="174" font-size="12" fill="#633806"></text>
<rect x="20" y="198" width="760" height="56" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="32" y="231" font-size="12.5" font-weight="bold" fill="#633806">Um pod, um ficheiro SQLite</text>
<text x="250" y="222" font-size="12" fill="#633806">se o disco ou o pod falharem,</text>
<text x="250" y="240" font-size="12" fill="#633806">perde-se o spool</text>
<text x="560" y="222" font-size="12" fill="#633806">backup do volume, ou broker</text>
<text x="560" y="240" font-size="12" fill="#633806">(Fase 9)</text>
<rect x="20" y="264" width="760" height="56" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="32" y="297" font-size="12.5" font-weight="bold" fill="#633806">Conta de administrador</text>
<text x="250" y="288" font-size="12" fill="#633806">o writer usa o admin do lakeFS (sem</text>
<text x="250" y="306" font-size="12" fill="#633806">permissões no open source)</text>
<text x="560" y="288" font-size="12" fill="#633806">chave própria só do writer</text>
<text x="560" y="306" font-size="12" fill="#633806"></text>
<rect x="20" y="330" width="760" height="56" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="32" y="363" font-size="12.5" font-weight="bold" fill="#633806">Latência de 60 s, sem 'live'</text>
<text x="250" y="354" font-size="12" fill="#633806">o dashboard só veria dados ao fim de</text>
<text x="250" y="372" font-size="12" fill="#633806">um minuto</text>
<text x="560" y="354" font-size="12" fill="#633806">caminho direto ao Timescale</text>
<text x="560" y="372" font-size="12" fill="#633806">(Fase 7)</text>
<rect x="20" y="396" width="760" height="56" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="32" y="429" font-size="12.5" font-weight="bold" fill="#633806">O spool nunca limpa</text>
<text x="250" y="420" font-size="12" fill="#633806">o ficheiro cresce sem limite, mesmo o</text>
<text x="250" y="438" font-size="12" fill="#633806">já exportado</text>
<text x="560" y="420" font-size="12" fill="#633806">purgar lotes exportados após N</text>
<text x="560" y="438" font-size="12" fill="#633806">dias</text>
<rect x="20" y="462" width="760" height="56" rx="8" fill="#f1f1ee" stroke="#8a8a85"/>
<text x="32" y="495" font-size="12.5" font-weight="bold" fill="#2c2c2a">Um merge por lote</text>
<text x="250" y="486" font-size="12" fill="#2c2c2a">~1 440 commits por dia no main:</text>
<text x="250" y="504" font-size="12" fill="#2c2c2a">histórico ruidoso</text>
<text x="560" y="486" font-size="12" fill="#2c2c2a">lotes maiores, ou 1 commit por</text>
<text x="560" y="504" font-size="12" fill="#2c2c2a">hora</text>
<rect x="20" y="528" width="760" height="56" rx="8" fill="#f1f1ee" stroke="#8a8a85"/>
<text x="32" y="561" font-size="12.5" font-weight="bold" fill="#2c2c2a">Identidade usa source_ts (1 s)</text>
<text x="250" y="552" font-size="12" fill="#2c2c2a">duas alterações iguais no mesmo</text>
<text x="250" y="570" font-size="12" fill="#2c2c2a">segundo fundem-se</text>
<text x="560" y="552" font-size="12" fill="#2c2c2a">juntar um contador ao event_id</text>
<text x="560" y="570" font-size="12" fill="#2c2c2a"></text>
<rect x="20" y="594" width="760" height="56" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="32" y="627" font-size="12.5" font-weight="bold" fill="#633806">Sem métricas</text>
<text x="250" y="618" font-size="12" fill="#633806">não se vê atraso, taxa de erro nem</text>
<text x="250" y="636" font-size="12" fill="#633806">tamanho do spool</text>
<text x="560" y="618" font-size="12" fill="#633806">Prometheus (Fase 9)</text>
<text x="560" y="636" font-size="12" fill="#633806"></text>
<rect x="20" y="670" width="18" height="18" rx="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="1"/>
<text x="34" y="693" font-weight="bold" fill="#791f1f"></text>
<text x="44" y="684" font-size="12" fill="#444" text-anchor="start">gravidade alta</text>
<rect x="180" y="670" width="18" height="18" rx="9" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="194" y="693" font-weight="bold" fill="#633806"></text>
<text x="204" y="684" font-size="12" fill="#444" text-anchor="start">média</text>
<rect x="280" y="670" width="18" height="18" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="294" y="693" font-weight="bold" fill="#2c2c2a"></text>
<text x="304" y="684" font-size="12" fill="#444" text-anchor="start">baixa</text>
</svg>
