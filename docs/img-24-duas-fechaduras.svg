<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Duas fechaduras: o gate decide, o lakeFS não confia</title>
<rect width="800" height="400" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Duas fechaduras: o gate decide, o lakeFS não confia</text>
<rect x="20" y="60" width="230" height="110" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="32" y="83" font-weight="bold" fill="#0c447c">1. G2 (no DAG, Python)</text>
<text x="32" y="104" font-size="12.5" fill="#0c447c">lê a silver da hora</text>
<text x="32" y="122" font-size="12.5" fill="#0c447c">aplica 7 regras</text>
<text x="32" y="140" font-size="12.5" fill="#0c447c">decide pass, warn ou fail</text>
<line x1="250" y1="115" x2="290" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="290" y="60" width="230" height="110" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="302" y="83" font-weight="bold" fill="#0c447c">2. escreve a prova</text>
<text x="302" y="104" font-size="12.5" fill="#0c447c">_gates/g2/dt=…/hour=….json</text>
<text x="302" y="122" font-size="12.5" fill="#0c447c">estado + regras + checksum</text>
<text x="302" y="140" font-size="12.5" fill="#0c447c">do ficheiro silver validado</text>
<line x1="520" y1="115" x2="560" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="560" y="60" width="220" height="110" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="572" y="83" font-weight="bold" fill="#27500a">3. merge para o main</text>
<text x="572" y="104" font-size="12.5" fill="#27500a">o DAG tenta juntar</text>
<text x="572" y="122" font-size="12.5" fill="#27500a">(se o G2 deu fail, nem</text>
<text x="572" y="140" font-size="12.5" fill="#27500a">tenta: GateFailed)</text>
<line x1="670" y1="170" x2="670" y2="215" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="440" y="215" width="340" height="100" rx="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="1"/>
<text x="452" y="238" font-weight="bold" fill="#791f1f">4. HOOK no lakeFS (Lua)</text>
<text x="452" y="259" font-size="12.5" fill="#791f1f">não confia no DAG: confere a prova</text>
<text x="452" y="277" font-size="12.5" fill="#791f1f">existe? não é fail? checksum igual?</text>
<text x="452" y="295" font-size="12.5" fill="#791f1f">se não: merge recusado (HTTP 412)</text>
<rect x="20" y="215" width="380" height="100" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="32" y="238" font-weight="bold" fill="#2c2c2a">Porquê duas fechaduras?</text>
<text x="32" y="259" font-size="12.5" fill="#2c2c2a">O DAG pode ter um erro ou ser contornado.</text>
<text x="32" y="277" font-size="12.5" fill="#2c2c2a">O hook corre dentro do lakeFS e é a regra</text>
<text x="32" y="295" font-size="12.5" fill="#2c2c2a">que ninguém consegue esquecer de aplicar.</text>
<text x="20" y="350" font-size="13" fill="#2c2c2a">Quem ficar de fora: o branch silver-&lt;dt&gt;-&lt;hh&gt; guarda o trabalho para autópsia.</text>
<text x="20" y="372" font-size="13" fill="#2c2c2a">E um commit normal não consegue apagar o hook (proteção pre-commit).</text>
</svg>
