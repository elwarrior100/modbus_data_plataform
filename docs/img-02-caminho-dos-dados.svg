<path d="M386 110 H420" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M582 110 H616" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="30" y="250" width="130" height="108" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="44" y="273" font-weight="bold" fill="#2c2c2a">Silver</text>
<text x="44" y="294" font-size="12.5"  fill="#2c2c2a">FASE 4</text>
<text x="44" y="312" font-size="12.5"  fill="#2c2c2a">limpo e</text>
<text x="44" y="330" font-size="12.5"  fill="#2c2c2a">organizado</text>
<rect x="184" y="250" width="130" height="108" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="198" y="273" font-weight="bold" fill="#2c2c2a">Gates</text>
<text x="198" y="294" font-size="12.5"  fill="#2c2c2a">FASE 5</text>
<text x="198" y="312" font-size="12.5"  fill="#2c2c2a">verificam a</text>
<text x="198" y="330" font-size="12.5"  fill="#2c2c2a">qualidade</text>
<rect x="338" y="250" width="130" height="108" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="352" y="273" font-weight="bold" fill="#2c2c2a">Gold</text>
<text x="352" y="294" font-size="12.5"  fill="#2c2c2a">FASE 6</text>
<text x="352" y="312" font-size="12.5"  fill="#2c2c2a">pronto para</text>
<text x="352" y="330" font-size="12.5"  fill="#2c2c2a">usar + versão</text>
<rect x="492" y="250" width="130" height="108" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="506" y="273" font-weight="bold" fill="#2c2c2a">Dashboard</text>
<text x="506" y="294" font-size="12.5"  fill="#2c2c2a">FASE 7</text>
<text x="506" y="312" font-size="12.5"  fill="#2c2c2a">ver tudo</text>
<text x="506" y="330" font-size="12.5"  fill="#2c2c2a">em tempo real</text>
<rect x="646" y="250" width="130" height="108" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="660" y="273" font-weight="bold" fill="#2c2c2a">Machine learning</text>
<text x="660" y="294" font-size="12.5"  fill="#2c2c2a">FASE 8</text>
<text x="660" y="312" font-size="12.5"  fill="#2c2c2a">prever falhas</text>
<path d="M160 304 H182" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M314 304 H336" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M468 304 H490" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M622 304 H644" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M698 164 V207 H95 V248" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<text x="400" y="200" font-size="12" fill="#444" text-anchor="middle">os dados seguem para a camada seguinte</text>
<rect x="30" y="384" width="20" height="20" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="44" y="407" font-weight="bold" fill="#27500a"></text>
<text x="58" y="399" font-size="12.5" fill="#444" text-anchor="start">feito e verificado</text>
<rect x="220" y="384" width="20" height="20" rx="9" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="234" y="407" font-weight="bold" fill="#633806"></text>
<text x="248" y="399" font-size="12.5" fill="#444" text-anchor="start">a seguir</text>
<rect x="340" y="384" width="20" height="20" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="354" y="407" font-weight="bold" fill="#2c2c2a"></text>
<text x="368" y="399" font-size="12.5" fill="#444" text-anchor="start">por fazer</text>
<text x="30" y="428" font-size="11.5" fill="#444" text-anchor="start">Fase 0 (a base: k3s, Postgres, lakeFS, SeaweedFS) e o Argo CD já estão feitos e não aparecem aqui, porque estão por baixo de tudo.</text>
