<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>O caminho dos dados: o que já fizemos e o que falta</title>
<rect width="800" height="440" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">O caminho dos dados: o que já fizemos e o que falta</text>
<rect x="30" y="56" width="160" height="108" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="44" y="79" font-weight="bold" fill="#27500a">Simulador</text>
<text x="44" y="100" font-size="12.5"  fill="#27500a">FASE 1</text>
<text x="44" y="118" font-size="12.5"  fill="#27500a">Modbus: 3 máquinas</text>
<text x="44" y="136" font-size="12.5"  fill="#27500a">a gerar valores</text>
<rect x="226" y="56" width="160" height="108" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="240" y="79" font-weight="bold" fill="#27500a">Gateway</text>
<text x="240" y="100" font-size="12.5"  fill="#27500a">FASE 2</text>
<text x="240" y="118" font-size="12.5"  fill="#27500a">traduz Modbus</text>
<text x="240" y="136" font-size="12.5"  fill="#27500a">para OPC UA</text>
<rect x="422" y="56" width="160" height="108" rx="9" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="436" y="79" font-weight="bold" fill="#633806">Collector</text>
<text x="436" y="100" font-size="12.5"  fill="#633806">FASE 3  (a seguir)</text>
<text x="436" y="118" font-size="12.5"  fill="#633806">lê o OPC UA e</text>
<text x="436" y="136" font-size="12.5"  fill="#633806">guarda sem perder</text>
<rect x="618" y="56" width="160" height="108" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="632" y="79" font-weight="bold" fill="#2c2c2a">Bronze</text>
<text x="632" y="100" font-size="12.5"  fill="#2c2c2a">FASE 3</text>
<text x="632" y="118" font-size="12.5"  fill="#2c2c2a">dados crus no</text>
<text x="632" y="136" font-size="12.5"  fill="#2c2c2a">lakeFS (Parquet)</text>
