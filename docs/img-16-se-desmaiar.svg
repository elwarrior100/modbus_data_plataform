<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>E se o arquivista desmaiar a meio? Recomeça do princípio, sem estragar nada</title>
<rect width="800" height="470" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">E se o arquivista desmaiar a meio? Recomeça do princípio, sem estragar nada</text>
<rect x="20" y="56" width="140" height="110" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
<circle cx="42" cy="78" r="14" fill="#534ab7"/><text x="42" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
<text x="90.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c3489">abrir a gaveta</text>
<path d="M161 111 H172" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="174" y="56" width="140" height="110" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
<circle cx="196" cy="78" r="14" fill="#534ab7"/><text x="196" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
<text x="244.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c3489">pôr a cópia</text>
<path d="M315 111 H326" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="328" y="56" width="140" height="110" rx="12" fill="#fcebeb" stroke="#a32d2d" stroke-width="1.5"/>
<circle cx="350" cy="78" r="14" fill="#a32d2d"/><text x="350" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
<text x="398.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#791f1f">assinar</text>
<path d="M469 111 H480" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="482" y="56" width="140" height="110" rx="12" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1.5"/>
<circle cx="504" cy="78" r="14" fill="#8a8a85"/><text x="504" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
<text x="552.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c2c2a">porteiro confere</text>
<path d="M623 111 H634" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="636" y="56" width="140" height="110" rx="12" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1.5"/>
<circle cx="658" cy="78" r="14" fill="#8a8a85"/><text x="658" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text>
<text x="706.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c2c2a">arquivar</text>
<text x="398" y="192" font-size="14" fill="#a32d2d" text-anchor="middle" font-weight="bold">⚡ desmaiou aqui</text>
<text x="20" y="236" font-size="14" fill="#2c2c2a" text-anchor="start" font-weight="bold">Quando acorda, faz tudo outra vez desde o passo 1. E não faz mal, porque:</text>
<rect x="20" y="262" width="760" height="36" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="34" y="285" font-size="13.5" font-weight="bold" fill="#27500a">abrir uma gaveta que já está aberta</text>
<text x="380" y="285" font-size="13" fill="#27500a">→ continua aberta  (branch: exist_ok)</text>
<rect x="20" y="306" width="760" height="36" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="34" y="329" font-size="13.5" font-weight="bold" fill="#27500a">pôr uma cópia que já lá está</text>
<text x="380" y="329" font-size="13" fill="#27500a">→ fica igual, não há duas  (mesmo nome de ficheiro)</text>
<rect x="20" y="350" width="760" height="36" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="34" y="373" font-size="13.5" font-weight="bold" fill="#27500a">assinar o que já está assinado</text>
<text x="380" y="373" font-size="13" fill="#27500a">→ "não há nada de novo"  (commit: no changes)</text>
<rect x="20" y="394" width="760" height="36" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="34" y="417" font-size="13.5" font-weight="bold" fill="#27500a">arquivar o que já está arquivado</text>
<text x="380" y="417" font-size="13" fill="#27500a">→ "nada a juntar"  (merge: no changes)</text>
<text x="20" y="452" font-size="12.5" fill="#0c447c" text-anchor="start">Isto chama-se idempotência: fazer duas vezes dá o mesmo que fazer uma. É a ideia mais importante da fase.</text>
</svg>
