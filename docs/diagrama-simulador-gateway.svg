<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="720" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold" font-size="15" fill="#2c2c2a">Do simulador Modbus ao gateway OPC UA: o que sai, o que entra</text>
<rect x="20" y="40" width="240" height="28" rx="6" fill="#3b6d11"/><text x="140.0" y="59" text-anchor="middle" font-weight="bold" fill="#ffffff">SIMULADOR (ot-simulator)</text>
<rect x="275" y="40" width="250" height="28" rx="6" fill="#854f0b"/><text x="400.0" y="59" text-anchor="middle" font-weight="bold" fill="#ffffff">LINHA RS-232 VIRTUAL</text>
<rect x="540" y="40" width="240" height="28" rx="6" fill="#185fa5"/><text x="660.0" y="59" text-anchor="middle" font-weight="bold" fill="#ffffff">GATEWAY (ot-gateway)</text>
<rect x="540" y="90" width="240" height="88" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="552" y="112" font-weight="bold" fill="#0c447c">1. SAI do gateway: pedido</text>
<text x="552" y="132" font-size="11.5"  fill="#0c447c">ModbusLink.read_holding(</text>
<text x="552" y="148" font-size="11.5"  fill="#0c447c">  unit 2, endereço 0, 7 registos)</text>
<text x="552" y="164" font-size="11.5"  fill="#0c447c">pymodbus, mestre em /tmp/ttyV0</text>
<rect x="275" y="90" width="250" height="88" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="287" y="112" font-weight="bold" fill="#633806">Fio: pedido (RTU)</text>
<text x="287" y="132" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">02 03 00 00 00 07</text>
<text x="287" y="148" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">+ CRC 04 3B</text>
<text x="287" y="164" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">unit 2 · função 03 · addr 0 · 7</text>
<rect x="20" y="90" width="240" height="88" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="32" y="112" font-weight="bold" fill="#27500a">2. ENTRA no simulador</text>
<text x="32" y="132" font-size="11.5"  fill="#27500a">RtuServer (thread) lê /tmp/ttyV1</text>
<text x="32" y="148" font-size="11.5"  fill="#27500a">handle_rtu_frame confere o CRC</text>
<text x="32" y="164" font-size="11.5"  fill="#27500a">e passa o PDU a handle_pdu</text>
<path d="M540 134L527 134" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M275 134L262 134" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="20" y="230" width="240" height="88" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="32" y="252" font-weight="bold" fill="#27500a">3. SAI do simulador: resposta</text>
<text x="32" y="272" font-size="11.5"  fill="#27500a">handle_pdu lê device.holding[0..6]</text>
<text x="32" y="288" font-size="11.5"  fill="#27500a">(só lê; não calcula nada) e</text>
<text x="32" y="304" font-size="11.5"  fill="#27500a">empacota os 7 registos</text>
<rect x="275" y="230" width="250" height="104" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="287" y="252" font-weight="bold" fill="#633806">Fio: resposta (RTU)</text>
<text x="287" y="272" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">02 03 0E 05 C8 00 00 07 08</text>
<text x="287" y="288" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">01 90 02 EE 00 C8 00 02</text>
<text x="287" y="304" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">+ CRC 6A BC</text>
<text x="287" y="320" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#633806">14 bytes de dados = 7 registos</text>
<rect x="540" y="230" width="240" height="88" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="552" y="252" font-weight="bold" fill="#0c447c">4. ENTRA no gateway</text>
<text x="552" y="272" font-size="11.5"  fill="#0c447c">pymodbus valida o CRC e devolve</text>
<text x="552" y="288" font-size="11.5"  fill="#0c447c">7 inteiros ao DevicePoller:</text>
<text x="552" y="304" font-size="11.5"  fill="#0c447c">[0x05C8, 0x0000, 0x0708, ...]</text>
<path d="M140 178L140 228" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M262 274L273 274" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M527 274L538 274" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="20" y="360" width="240" height="88" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="32" y="382" font-weight="bold" fill="#27500a">Em paralelo (thread de 100 ms)</text>
<text x="32" y="402" font-size="11.5"  fill="#27500a">Device.step() escreve a tabela</text>
<text x="32" y="418" font-size="11.5"  fill="#27500a">device.holding; não sabe que o</text>
<text x="32" y="434" font-size="11.5"  fill="#27500a">gateway existe</text>
<path d="M140 360V320" stroke="#3b6d11" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
<text x="150" y="344" font-size="11" fill="#27500a">escreve</text>
<path d="M660 318L660 348" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="540" y="350" width="240" height="70" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="552" y="372" font-weight="bold" fill="#0c447c">5. Descodificar</text>
<text x="552" y="392" font-size="11.5"  fill="#0c447c">registers.decode: uint32 em CDAB</text>
<text x="552" y="408" font-size="11.5"  fill="#0c447c">[0x05C8, 0x0000] → 1480</text>
<path d="M660 420L660 454" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="540" y="456" width="240" height="88" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="552" y="478" font-weight="bold" fill="#0c447c">6. Escalar e dar estado</text>
<text x="552" y="498" font-size="11.5"  fill="#0c447c">1480 × escala 1 = 1480</text>
<text x="552" y="514" font-size="11.5"  fill="#0c447c">dentro de 0–3600 → Good</text>
<text x="552" y="530" font-size="11.5"  fill="#0c447c">(sem resposta → Bad, sem valor)</text>
<path d="M660 544L660 560" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="540" y="562" width="240" height="88" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="552" y="584" font-weight="bold" fill="#0c447c">7. Publicar</text>
<text x="552" y="604" font-size="11.5"  fill="#0c447c">address_space.publish: só se mudou</text>
<text x="552" y="620" font-size="11.5"  fill="#0c447c">DataValue(1480.0, Good,</text>
<text x="552" y="636" font-size="11.5"  fill="#0c447c">SourceTimestamp, ServerTimestamp)</text>
<rect x="540" y="670" width="240" height="40" rx="8" fill="#ffffff" stroke="#185fa5" stroke-width="2"/>
<text x="660" y="687" text-anchor="middle" font-weight="bold" fill="#0c447c">8. SAI: OPC UA :4840</text>
<text x="660" y="702" text-anchor="middle" font-size="11" fill="#0c447c">MOTOR-01.speed_rpm → collector</text>
<path d="M660 650L660 668" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="400" y="400" text-anchor="middle" font-size="12" fill="#633806">A única coisa que atravessa a linha</text>
<text x="400" y="418" text-anchor="middle" font-size="12" fill="#633806">são estes dois quadros de bytes.</text>
<text x="400" y="446" text-anchor="middle" font-size="11" fill="#444">Escalas, unidades e ordem de palavras</text>
<text x="400" y="462" text-anchor="middle" font-size="11" fill="#444">não viajam: o gateway conhece-as</text>
<text x="400" y="478" text-anchor="middle" font-size="11" fill="#444">por devices.yaml (o contrato).</text>
</svg>
