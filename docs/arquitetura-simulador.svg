<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Arquitetura do simulador OT (Fase 1)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="640" fill="#ffffff"/>

  <!-- clientes -->
  <g fill="#f1f1ee" stroke="#8a8a85">
    <rect x="40" y="28" width="200" height="52" rx="6"/>
    <rect x="300" y="28" width="220" height="52" rx="6"/>
    <rect x="580" y="28" width="190" height="52" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#2c2c2a">
    <text x="140" y="50" font-weight="bold">Cliente Modbus TCP</text><text x="140" y="68" font-size="11">gateway (Fase 2), pymodbus</text>
    <text x="410" y="50" font-weight="bold">Mestre Modbus RTU</text><text x="410" y="68" font-size="11">lê /tmp/ttyV0 (RS-232)</text>
    <text x="675" y="50" font-weight="bold">Operador / testes</text><text x="675" y="68" font-size="11">curl, scripts</text>
  </g>

  <!-- pod -->
  <rect x="20" y="110" width="760" height="500" rx="14" fill="none" stroke="#8a8a85" stroke-dasharray="6 5"/>
  <text x="36" y="132" font-weight="bold" fill="#444">Pod ot-simulator (namespace ot, k3s)</text>

  <!-- transportes -->
  <g fill="#e6f1fb" stroke="#185fa5">
    <rect x="40" y="150" width="200" height="150" rx="8"/>
    <rect x="300" y="150" width="220" height="60" rx="8"/>
    <rect x="300" y="240" width="220" height="60" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#0c447c">
    <text x="140" y="212" font-weight="bold">Modbus TCP :5020</text><text x="140" y="232" font-size="11">servers.py (asyncio)</text><text x="140" y="248" font-size="11">trama MBAP</text>
    <text x="410" y="176" font-weight="bold">Par série virtual</text><text x="410" y="196" font-size="11">socat: ttyV0 ⇄ ttyV1 (8N1)</text>
    <text x="410" y="266" font-weight="bold">RtuServer (thread)</text><text x="410" y="286" font-size="11">lê ttyV1, trama RTU + CRC</text>
  </g>

  <!-- controlo -->
  <rect x="580" y="150" width="190" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <g text-anchor="middle" fill="#633806">
    <text x="675" y="176" font-weight="bold">HTTP :8080</text><text x="675" y="196" font-size="11">control.py: cenários, estado</text>
  </g>

  <!-- protocolo -->
  <rect x="120" y="340" width="330" height="56" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
  <g text-anchor="middle" fill="#27500a">
    <text x="285" y="364" font-weight="bold">modbus.py: handle_pdu(unit, pdu)</text>
    <text x="285" y="382" font-size="11">funções 0x01 e 0x03; calado se o dispositivo está offline</text>
  </g>

  <!-- engine -->
  <rect x="580" y="340" width="190" height="80" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <g text-anchor="middle" fill="#633806">
    <text x="675" y="364" font-weight="bold">ScenarioEngine</text><text x="675" y="384" font-size="11">drift, stuck, spike, gap…</text>
    <text x="675" y="402" font-size="11">carrega scenarios.yaml (ConfigMap)</text>
  </g>

  <!-- plant -->
  <rect x="40" y="430" width="500" height="150" rx="10" fill="#f7fbf3" stroke="#3b6d11"/>
  <text x="56" y="452" font-weight="bold" fill="#27500a">Plant (model.py): registos Modbus em memória</text>
  <g fill="#eaf3de" stroke="#3b6d11">
    <rect x="60" y="470" width="140" height="80" rx="6"/>
    <rect x="220" y="470" width="140" height="80" rx="6"/>
    <rect x="380" y="470" width="140" height="80" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#27500a">
    <text x="130" y="494" font-weight="bold">PUMP-01</text><text x="130" y="514" font-size="11">unit 1 · palavras ABCD</text><text x="130" y="532" font-size="11">holding + coil de alarme</text>
    <text x="290" y="494" font-weight="bold">MOTOR-01</text><text x="290" y="514" font-size="11">unit 2 · palavras CDAB</text><text x="290" y="532" font-size="11">holding + coil de alarme</text>
    <text x="450" y="494" font-weight="bold">CHILLER-01</text><text x="450" y="514" font-size="11">unit 3 · palavras ABCD</text><text x="450" y="532" font-size="11">holding (sem coil)</text>
  </g>

  <!-- tick -->
  <rect x="580" y="470" width="190" height="70" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
  <g text-anchor="middle" fill="#27500a">
    <text x="675" y="498" font-weight="bold">Ciclo de simulação</text><text x="675" y="518" font-size="11">thread a cada 100 ms: Plant.step()</text>
  </g>

  <!-- setas -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M140 80V150"/>
    <path d="M410 80V150"/>
    <path d="M675 80V150"/>
    <path d="M410 210V240"/>
    <path d="M140 300V340"/>
    <path d="M410 300V340"/>
    <path d="M285 396V430"/>
    <path d="M675 210V340"/>
    <path d="M580 400L540 450"/>
    <path d="M580 505H540"/>
  </g>

  <!-- legenda -->
  <g font-size="11" fill="#444">
    <rect x="40" y="592" width="12" height="12" fill="#e6f1fb" stroke="#185fa5"/><text x="58" y="602">transporte</text>
    <rect x="130" y="592" width="12" height="12" fill="#eaf3de" stroke="#3b6d11"/><text x="148" y="602">simulação e protocolo</text>
    <rect x="270" y="592" width="12" height="12" fill="#faeeda" stroke="#854f0b"/><text x="288" y="602">controlo e cenários</text>
  </g>
</svg>
