<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Promessa 1: não perder nenhuma leitura</title>
<rect width="800" height="400" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Promessa 1: não perder nenhuma leitura</text>
<rect x="20" y="56" width="370" height="250" rx="12" fill="#fcebeb" stroke="#a32d2d" stroke-width="1.5"/>
<text x="205.0" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#791f1f">ERRADO</text>
<text x="205.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#791f1f"></text>
<text x="205.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#791f1f">escrever a lápis,</text>
<text x="205.0" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#791f1f">dizer "recebi"</text>
<text x="205.0" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#791f1f">e só depois guardar</text>
<text x="205.0" y="276" text-anchor="middle" font-size="12" fill="#791f1f">se a luz falhar nesse momento,</text>
<text x="205.0" y="292" text-anchor="middle" font-size="12" fill="#791f1f">a leitura desaparece</text>
<rect x="410" y="56" width="370" height="250" rx="12" fill="#eaf3de" stroke="#3b6d11" stroke-width="1.5"/>
<text x="595.0" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">CERTO (o que fizemos)</text>
<text x="595.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a"></text>
<text x="595.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">escrever à caneta,</text>
<text x="595.0" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">esperar que seque,</text>
<text x="595.0" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500a">só então seguir</text>
<text x="595.0" y="276" text-anchor="middle" font-size="12" fill="#27500a">no código: o SQLite faz fsync a</text>
<text x="595.0" y="292" text-anchor="middle" font-size="12" fill="#27500a">cada gravação (synchronous=FULL)</text>
<text x="400" y="345" font-size="13.5" fill="#2c2c2a" text-anchor="middle" font-weight="bold">O caderno é um ficheiro no disco do pod. Se o pod reiniciar, o caderno continua lá.</text>
<text x="400" y="372" font-size="12.5" fill="#791f1f" text-anchor="middle">O que fica por escrever num caderno desligado (collector parado) perde-se: é o ponto fraco nº 1.</text>
</svg>
