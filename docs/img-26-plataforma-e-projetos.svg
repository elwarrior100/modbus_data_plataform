<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Plataforma partilhada + um repositório por projeto</title>
<rect width="820" height="500" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Um repositório de plataforma (gitops) + um repositório por projeto</text>

<!-- repos de projeto -->
<rect x="20" y="55" width="220" height="80" rx="9" fill="#e6f1fb" stroke="#185fa5"/>
<text x="32" y="78" font-weight="bold" fill="#0c447c">repo do projeto Modbus</text>
<text x="32" y="98" font-size="12.5" fill="#0c447c">código + DAGs + Dockerfiles</text>
<text x="32" y="116" font-size="12.5" fill="#0c447c">testes · docs</text>
<rect x="20" y="150" width="220" height="60" rx="9" fill="#f1efe8" stroke="#888780" stroke-dasharray="5 4"/>
<text x="32" y="173" font-weight="bold" fill="#444441">repo de outro projeto</text>
<text x="32" y="192" font-size="12.5" fill="#444441">(futuro, outros DAGs)</text>

<!-- CI e registo -->
<line x1="240" y1="95" x2="290" y2="95" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="246" y="85" font-size="11.5" fill="#444">push</text>
<rect x="290" y="55" width="200" height="80" rx="9" fill="#eaf3de" stroke="#3b6d11"/>
<text x="302" y="78" font-weight="bold" fill="#27500a">1. CI (GitHub Actions)</text>
<text x="302" y="98" font-size="12.5" fill="#27500a">testes + imagem arm64</text>
<text x="302" y="116" font-size="12.5" fill="#27500a">tag = SHA do commit</text>
<line x1="490" y1="95" x2="540" y2="95" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="540" y="55" width="260" height="80" rx="9" fill="#eaf3de" stroke="#3b6d11"/>
<text x="552" y="78" font-weight="bold" fill="#27500a">2. registo de imagens (GHCR)</text>
<text x="552" y="98" font-size="12.5" fill="#27500a">modbus/ingest:3f9a2c1</text>
<text x="552" y="116" font-size="12.5" fill="#27500a">modbus/pipelines:3f9a2c1</text>

<!-- gitops -->
<line x1="390" y1="135" x2="390" y2="230" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="398" y="190" font-size="11.5" fill="#444">3. commit: "modbus usa a tag 3f9a2c1"</text>
<rect x="160" y="230" width="460" height="150" rx="9" fill="#faeeda" stroke="#854f0b"/>
<text x="174" y="253" font-weight="bold" fill="#633806">repo gitops (plataforma, serve para TODOS os projetos)</text>
<text x="174" y="278" font-size="12.5" fill="#633806">terraform/oracle/ ...... a máquina</text>
<text x="174" y="298" font-size="12.5" fill="#633806">platform/ ................ Airflow, Postgres, lakeFS, OpenMetadata, Argo CD</text>
<text x="174" y="318" font-size="12.5" fill="#633806">projects/modbus/ ...... imagens, origem dos DAGs, namespace, quotas</text>
<text x="174" y="338" font-size="12.5" fill="#633806">projects/&lt;novo&gt;/ ........ projeto novo = pasta nova</text>
<text x="174" y="358" font-size="12.5" fill="#633806">envs/local · envs/oracle ... ajustes por ambiente</text>

<!-- clusters -->
<line x1="300" y1="380" x2="200" y2="420" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="480" y1="380" x2="580" y2="420" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="330" y="405" font-size="11.5" fill="#444">4. o Argo CD de cada cluster lê e aplica</text>
<rect x="40" y="420" width="300" height="62" rx="9" fill="#e6f1fb" stroke="#185fa5"/>
<text x="52" y="443" font-weight="bold" fill="#0c447c">cluster local (Mac, Lima + k3s)</text>
<text x="52" y="463" font-size="12.5" fill="#0c447c">envs/local: 8 CPU / 16 GB</text>
<rect x="480" y="420" width="320" height="62" rx="9" fill="#e6f1fb" stroke="#185fa5"/>
<text x="492" y="443" font-weight="bold" fill="#0c447c">cluster Oracle (k3s)</text>
<text x="492" y="463" font-size="12.5" fill="#a32d2d">envs/oracle: 2 CPU / 12 GB · ⚠ alerta de custos antes</text>
</svg>
