<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>A prova prende-se aos bytes exatos do ficheiro (checksum)</title>
<rect width="800" height="400" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">A prova prende-se aos bytes exatos do ficheiro (checksum)</text>
<rect x="20" y="60" width="240" height="100" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="32" y="83" font-weight="bold" fill="#0c447c">Silver da hora 17</text>
<text x="32" y="104" font-size="12.5" fill="#0c447c">data.parquet</text>
<text x="32" y="122" font-size="12.5" fill="#0c447c">checksum: 9dd4e461…</text>
<line x1="260" y1="110" x2="360" y2="110" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="291" y="104" font-size="12" fill="#444">G2 valida</text>
<rect x="360" y="60" width="250" height="100" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="372" y="83" font-weight="bold" fill="#27500a">Atestação (pass)</text>
<text x="372" y="104" font-size="12.5" fill="#27500a">files: { data.parquet:</text>
<text x="372" y="122" font-size="12.5" fill="#27500a">  9dd4e461… }</text>
<text x="20" y="196" font-size="13" fill="#27500a" font-weight="bold">Caso normal: o hook compara o checksum do ficheiro com o da prova → iguais → merge passa.</text>
<rect x="20" y="225" width="240" height="100" rx="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="1"/>
<text x="32" y="248" font-weight="bold" fill="#791f1f">Alguém muda o ficheiro</text>
<text x="32" y="269" font-size="12.5" fill="#791f1f">depois de o G2 o validar</text>
<text x="32" y="287" font-size="12.5" fill="#791f1f">checksum: 5ab31c07…</text>
<line x1="260" y1="275" x2="360" y2="275" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="291" y="269" font-size="12" fill="#444">hook compara</text>
<rect x="360" y="225" width="250" height="100" rx="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="1"/>
<text x="372" y="248" font-weight="bold" fill="#791f1f">Diferente → recusado</text>
<text x="372" y="269" font-size="12.5" fill="#791f1f">"mudou depois de validado"</text>
<text x="372" y="287" font-size="12.5" fill="#791f1f">o main não vê nada</text>
<text x="20" y="360" font-size="13" fill="#2c2c2a">Sem isto, bastava validar um ficheiro bom e trocá-lo por outro antes do merge.</text>
</svg>
