<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>O que é o git: três sítios onde o teu trabalho pode estar</title>
<rect width="800" height="470" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">O que é o git: três sítios onde o teu trabalho pode estar</text>
<rect x="30" y="60" width="220" height="168" rx="9" fill="#ffffff" stroke="#8a8a85" stroke-width="1"/>
<text x="44" y="83" font-weight="bold" fill="#2c2c2a">1. PASTA DE TRABALHO</text>
<text x="44" y="104" font-size="12.5"  fill="#2c2c2a">os ficheiros que vês</text>
<text x="44" y="122" font-size="12.5"  fill="#2c2c2a">e que editas</text>
<text x="44" y="140" font-size="12.5"  fill="#2c2c2a"></text>
<text x="44" y="158" font-size="12.5"  fill="#2c2c2a">ex.: platform/k8s/ot/</text>
<text x="44" y="176" font-size="12.5"  fill="#2c2c2a">ot-edge.yaml</text>
<rect x="290" y="60" width="220" height="168" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="304" y="83" font-weight="bold" fill="#0c447c">2. HISTORIAL LOCAL</text>
<text x="304" y="104" font-size="12.5"  fill="#0c447c">só no teu Mac</text>
<text x="304" y="122" font-size="12.5"  fill="#0c447c">cada commit é uma</text>
<text x="304" y="140" font-size="12.5"  fill="#0c447c">fotografia do projeto</text>
<text x="304" y="158" font-size="12.5"  fill="#0c447c">inteiro, com data e</text>
<text x="304" y="176" font-size="12.5"  fill="#0c447c">uma mensagem</text>
<rect x="550" y="60" width="220" height="168" rx="9" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text x="564" y="83" font-weight="bold" fill="#3c3489">3. GITHUB</text>
<text x="564" y="104" font-size="12.5"  fill="#3c3489">uma cópia na internet</text>
<text x="564" y="122" font-size="12.5"  fill="#3c3489"></text>
<text x="564" y="140" font-size="12.5"  fill="#3c3489">é daqui que o</text>
<text x="564" y="158" font-size="12.5"  fill="#3c3489">Argo CD lê</text>
<path d="M252 144 H288" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<text x="270" y="130" font-size="12.5" fill="#444" text-anchor="middle" font-weight="bold">commit</text>
<path d="M512 144 H548" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<text x="530" y="130" font-size="12.5" fill="#444" text-anchor="middle" font-weight="bold">push</text>
<text x="270" y="248" font-size="11" fill="#444" text-anchor="middle">git add + git commit</text>
<text x="530" y="248" font-size="11" fill="#444" text-anchor="middle">git push</text>
<text x="30" y="292" font-size="13.5" fill="#2c2c2a" text-anchor="start" font-weight="bold">Os 'ramos' (branches) são etiquetas que apontam para um commit. Neste momento:</text>
<rect x="30" y="312" width="150" height="26" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="44" y="335" font-weight="bold" fill="#0c447c">main</text>
<path d="M182 325 H214" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="216" y="312" width="110" height="26" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="230" y="335" font-weight="bold" fill="#27500a">8403ce2</text>
<text x="340" y="330" font-size="12.5" fill="#444" text-anchor="start">o ramo principal (no teu Mac)</text>
<rect x="30" y="346" width="150" height="26" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="44" y="369" font-weight="bold" fill="#0c447c">test</text>
<path d="M182 359 H214" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="216" y="346" width="110" height="26" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="230" y="369" font-weight="bold" fill="#27500a">8403ce2</text>
<text x="340" y="364" font-size="12.5" fill="#444" text-anchor="start">o ramo onde temos trabalhado</text>
<rect x="30" y="380" width="150" height="26" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="44" y="403" font-weight="bold" fill="#0c447c">origin/main</text>
<path d="M182 393 H214" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="216" y="380" width="110" height="26" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="230" y="403" font-weight="bold" fill="#27500a">8403ce2</text>
<text x="340" y="398" font-size="12.5" fill="#444" text-anchor="start">o main, tal como está no GitHub</text>
<rect x="30" y="414" width="150" height="26" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="44" y="437" font-weight="bold" fill="#0c447c">origin/test</text>
<path d="M182 427 H214" stroke="#444" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="216" y="414" width="110" height="26" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="230" y="437" font-weight="bold" fill="#27500a">8403ce2</text>
<text x="340" y="432" font-size="12.5" fill="#444" text-anchor="start">o test, tal como está no GitHub</text>
<text x="30" y="452" font-size="12.5" fill="#27500a" text-anchor="start" font-weight="bold">Todos apontam para o mesmo commit (8403ce2): está tudo em dia, nada ficou só no teu Mac.</text>
</svg>
