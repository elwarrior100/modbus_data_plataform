<rect x="170" y="75" width="110" height="70" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="182" y="98" font-weight="bold" fill="#27500a">22:55</text>
<text x="182" y="119" font-size="12.5" fill="#27500a">legível</text>
