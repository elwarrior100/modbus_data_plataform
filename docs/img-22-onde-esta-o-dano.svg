<text x="572" y="98" font-weight="bold" fill="#791f1f">22:59</text>
<text x="572" y="119" font-size="12.5" fill="#791f1f">ILEGÍVEL</text>
<line x1="150" y1="110" x2="170" y2="110" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="280" y1="110" x2="300" y2="110" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="410" y1="110" x2="430" y2="110" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
