<text x="40" y="172" font-size="12.5" fill="#444">cada commit aponta para uma "metarange" (a lista do que ele contém)</text>
<line x1="615" y1="145" x2="615" y2="215" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="500" y="215" width="280" height="90" rx="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="1"/>
<text x="512" y="238" font-weight="bold" fill="#791f1f">metarange fc3b2e46…</text>
<text x="512" y="259" font-size="12.5" fill="#791f1f">está no ficheiro de volume 20</text>
<text x="512" y="277" font-size="12.5" fill="#791f1f">do SeaweedFS, cortado no fim</text>
<text x="512" y="295" font-size="12.5" fill="#791f1f">(o único objeto ilegível)</text>
<rect x="30" y="215" width="430" height="90" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="42" y="238" font-weight="bold" fill="#27500a">O que está intacto</text>
<text x="42" y="259" font-size="12.5" fill="#27500a">commits até 22:58 (447 ficheiros bronze e 18 silver legíveis)</text>
<text x="42" y="277" font-size="12.5" fill="#27500a">spool no PostgreSQL com TODOS os eventos</text>
<text x="42" y="295" font-size="12.5" fill="#27500a">o código e os testes dos gates</text>
<text x="30" y="345" font-size="13" fill="#27500a" font-weight="bold">O lote perdido (392969388b01ac59) não se perdeu de facto: os eventos continuam no spool.</text>
<text x="30" y="368" font-size="13" fill="#2c2c2a">Falta só reescrevê-lo no lakeFS. O writer sabe fazê-lo sozinho (cada passo é repetível).</text>
