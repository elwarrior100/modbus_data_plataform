<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Releases do gold, o ponteiro LATEST_STABLE e o rollback (ADR-019, opção S1)</title>
<rect width="800" height="400" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Uma release por dia; o ponteiro diz qual é a boa; rollback = mudar o ponteiro</text>
<line x1="40" y1="150" x2="760" y2="150" stroke="#8a8a85" stroke-width="2"/>
<text x="40" y="135" font-size="12.5" fill="#5f5e5a">main</text>
<circle cx="150" cy="150" r="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="2"/>
<circle cx="380" cy="150" r="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="2"/>
<circle cx="610" cy="150" r="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="2"/>
<rect x="80" y="60" width="140" height="50" rx="6" fill="#eaf3de" stroke="#3b6d11"/>
<text x="92" y="80" font-size="12" fill="#27500a">gold-v1.0.0+…2302</text>
<text x="92" y="98" font-size="12" fill="#27500a">G3 pass · dia 22</text>
<rect x="310" y="60" width="140" height="50" rx="6" fill="#eaf3de" stroke="#3b6d11"/>
<text x="322" y="80" font-size="12" fill="#27500a">gold-v1.0.0+…2402</text>
<text x="322" y="98" font-size="12" fill="#27500a">G3 pass · dia 23</text>
<rect x="540" y="60" width="140" height="50" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="552" y="80" font-size="12" fill="#791f1f">gold-v1.0.0+…2502</text>
<text x="552" y="98" font-size="12" fill="#791f1f">dia 24: erro achado</text>
<line x1="150" y1="110" x2="150" y2="140" stroke="#444" stroke-width="1.2"/>
<line x1="380" y1="110" x2="380" y2="140" stroke="#444" stroke-width="1.2"/>
<line x1="610" y1="110" x2="610" y2="140" stroke="#444" stroke-width="1.2"/>
<rect x="250" y="200" width="300" height="56" rx="9" fill="#e6f1fb" stroke="#185fa5"/>
<text x="262" y="222" font-weight="bold" fill="#0c447c">_releases/LATEST_STABLE</text>
<text x="262" y="243" font-size="12.5" fill="#0c447c">um ficheiro pequeno com o nome de UMA tag</text>
<line x1="500" y1="200" x2="600" y2="163" stroke="#a32d2d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="520" y="192" font-size="12" fill="#791f1f">antes</text>
<line x1="330" y1="200" x2="375" y2="163" stroke="#3b6d11" stroke-width="2" marker-end="url(#a)"/>
<text x="250" y="192" font-size="12" fill="#27500a">depois do rollback</text>
<rect x="40" y="290" width="340" height="90" rx="9" fill="#faeeda" stroke="#854f0b"/>
<text x="52" y="312" font-weight="bold" fill="#633806">Rollback (~3–5 s, sem copiar dados)</text>
<text x="52" y="332" font-size="12.5" fill="#633806">escrever o nome da tag anterior no ficheiro</text>
<text x="52" y="350" font-size="12.5" fill="#633806">o hook só aceita uma tag que existe e tem G3</text>
<text x="52" y="368" font-size="12.5" fill="#633806">fica no lakectl log: quem, quando, porquê</text>
<rect x="410" y="290" width="350" height="90" rx="9" fill="#f1efe8" stroke="#5f5e5a"/>
<text x="422" y="312" font-weight="bold" fill="#2c2c2a">Cada release leva o seu manifest</text>
<text x="422" y="332" font-size="12.5" fill="#2c2c2a">contagens, código (git), resultados G2 e G3</text>
<text x="422" y="350" font-size="12.5" fill="#2c2c2a">e o commit de bronze de cada hora de silver</text>
<text x="422" y="368" font-size="12.5" fill="#2c2c2a">gold → silver → bronze, por IDs de commit</text>
</svg>
