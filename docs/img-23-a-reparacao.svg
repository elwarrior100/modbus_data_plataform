<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>A reparação proposta (ainda NÃO feita) e como evitar a repetição</title>
<rect width="800" height="420" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">A reparação proposta (ainda NÃO feita) e como evitar a repetição</text>
<rect x="20" y="60" width="230" height="100" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="32" y="83" font-weight="bold" fill="#0c447c">1. main volta atrás</text>
<text x="32" y="104" font-size="12.5" fill="#0c447c">hard-reset para o commit</text>
<text x="32" y="122" font-size="12.5" fill="#0c447c">de 22:58 (verificado)</text>
<text x="32" y="140" font-size="12.5" fill="#0c447c">descarta só os 2 commits maus</text>
<line x1="250" y1="110" x2="285" y2="110" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="285" y="60" width="230" height="100" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="297" y="83" font-weight="bold" fill="#0c447c">2. apagar o branch mau</text>
<text x="297" y="104" font-size="12.5" fill="#0c447c">etl-392969388b01ac59</text>
<text x="297" y="122" font-size="12.5" fill="#0c447c">(também aponta para a</text>
<text x="297" y="140" font-size="12.5" fill="#0c447c">metarange ilegível)</text>
<line x1="515" y1="110" x2="550" y2="110" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="550" y="60" width="230" height="100" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="562" y="83" font-weight="bold" fill="#0c447c">3. lote volta a pending</text>
<text x="562" y="104" font-size="12.5" fill="#0c447c">no spool (PostgreSQL)</text>
<text x="562" y="122" font-size="12.5" fill="#0c447c">para o writer o refazer</text>
<line x1="665" y1="160" x2="665" y2="205" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="550" y="205" width="230" height="90" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="562" y="228" font-weight="bold" fill="#27500a">4. o writer refaz tudo</text>
<text x="562" y="249" font-size="12.5" fill="#27500a">branch, upload, validar G1,</text>
<text x="562" y="267" font-size="12.5" fill="#27500a">merge; depois os 9 185 em espera</text>
<text x="20" y="196" font-size="13" fill="#791f1f" font-weight="bold">Pede a tua decisão: mexe na história do main.</text>
<rect x="20" y="205" width="500" height="90" rx="9" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="32" y="228" font-weight="bold" fill="#633806">Para não voltar a acontecer</text>
<text x="32" y="249" font-size="12.5" fill="#633806">parar a VM sempre com:  limactl stop industrial</text>
<text x="32" y="267" font-size="12.5" fill="#633806">(antes de fechar o Mac ou a app)</text>
<text x="32" y="285" font-size="12.5" fill="#633806">e, mais tarde, SeaweedFS com gravação forçada (fsync)</text>
<text x="20" y="335" font-size="13" fill="#2c2c2a">Depois da reparação: instalar os hooks do G2 no industrial-lake e testar com um comms_gap real.</text>
</svg>
