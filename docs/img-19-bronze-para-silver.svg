<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Bronze para silver: trabalha-se num branch e só se publica depois de verificar</title>
<rect width="800" height="430" fill="#ffffff"/>
<text x="20" y="28" font-weight="bold" font-size="16" fill="#2c2c2a">Bronze para silver: trabalha-se num branch e só se publica depois de verificar</text>
<rect x="30" y="60" width="150" height="90" rx="9" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="42" y="83" font-weight="bold" fill="#633806">1. main</text>
<text x="42" y="104" font-size="12.5" fill="#633806">bronze/ (hora 17)</text>
<text x="42" y="122" font-size="12.5" fill="#633806">silver/ (horas antigas)</text>
<line x1="180" y1="105" x2="250" y2="105" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="221" y="99" font-size="12" fill="#444">cria</text>
<rect x="250" y="60" width="170" height="90" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="262" y="83" font-weight="bold" fill="#0c447c">2. branch</text>
<text x="262" y="104" font-size="12.5" fill="#0c447c">silver-2026-11-07-17</text>
<text x="262" y="122" font-size="12.5" fill="#0c447c">(cópia barata do main)</text>
<rect x="250" y="200" width="170" height="100" rx="9" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="262" y="223" font-weight="bold" fill="#0c447c">3. transforma</text>
<text x="262" y="244" font-size="12.5" fill="#0c447c">DuckDB lê o bronze,</text>
<text x="262" y="262" font-size="12.5" fill="#0c447c">tipa, põe quality e flags</text>
<text x="262" y="280" font-size="12.5" fill="#0c447c">e grava data.parquet</text>
<line x1="335" y1="150" x2="335" y2="200" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="200" width="170" height="100" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="482" y="223" font-weight="bold" fill="#27500a">4. verifica</text>
<text x="482" y="244" font-size="12.5" fill="#27500a">linhas silver</text>
<text x="482" y="262" font-size="12.5" fill="#27500a">== linhas bronze ?</text>
<text x="482" y="280" font-size="12.5" fill="#27500a">(lê de volta do lakeFS)</text>
<line x1="420" y1="250" x2="470" y2="250" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="60" width="170" height="90" rx="9" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="482" y="83" font-weight="bold" fill="#27500a">5. merge</text>
<text x="482" y="104" font-size="12.5" fill="#27500a">silver entra no main</text>
<text x="482" y="122" font-size="12.5" fill="#27500a">e o branch apaga-se</text>
<line x1="555" y1="200" x2="555" y2="150" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="561" y="169" font-size="12" fill="#444">sim</text>
<rect x="450" y="340" width="210" height="70" rx="9" fill="#fcebeb" stroke="#a32d2d" stroke-width="1"/>
<text x="462" y="363" font-weight="bold" fill="#791f1f">falhou antes do merge?</text>
<text x="462" y="384" font-size="12.5" fill="#791f1f">o main não mudou nada</text>
<line x1="555" y1="300" x2="555" y2="340" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="561" y="314" font-size="12" fill="#444">não</text>
<rect x="670" y="330" width="100" height="90" rx="9" fill="#f1f1ee" stroke="#8a8a85" stroke-width="1"/>
<text x="682" y="353" font-weight="bold" fill="#2c2c2a">repetir</text>
<text x="682" y="374" font-size="12.5" fill="#2c2c2a">é seguro:</text>
<text x="682" y="392" font-size="12.5" fill="#2c2c2a">dá o mesmo</text>
<text x="682" y="410" font-size="12.5" fill="#2c2c2a">resultado</text>
<line x1="660" y1="375" x2="668" y2="375" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
