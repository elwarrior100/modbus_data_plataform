<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="730" fill="#ffffff"/>
<text x="30" y="26" font-weight="bold" font-size="15" fill="#2c2c2a">Do tick de 100 ms até ao registo (cada caixa chama a seguinte)</text>
<rect x="30" y="46" width="740" height="66" rx="8" fill="#f1f1ee" stroke="#8a8a85"/>
<text x="44" y="68" font-weight="bold" fill="#2c2c2a">main.py  ·  thread «sim»  run_ticks()</text>
<text x="44" y="87" font-size="12" font-family="Menlo, Consolas, monospace" fill="#2c2c2a">while not stop.wait(0.1): plant.step()</text>
<text x="44" y="104" font-size="12" fill="#2c2c2a">acorda de 100 em 100 ms, para sempre</text>
<path d="M70 112V154" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="52" y="154" width="718" height="66" rx="8" fill="#faeeda" stroke="#854f0b"/>
<text x="66" y="176" font-weight="bold" fill="#633806">model.py  ·  Plant.step()</text>
<text x="66" y="195" font-size="12" font-family="Menlo, Consolas, monospace" fill="#633806">with self.lock:  for device in devices: device.step()</text>
<text x="66" y="212" font-size="12" fill="#633806">agarra o lock (ninguém lê os registos a meio) e percorre os 3 dispositivos</text>
<path d="M92 220V262" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="74" y="262" width="696" height="66" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="88" y="284" font-weight="bold" fill="#27500a">model.py  ·  Device.step()   (um por dispositivo)</text>
<text x="88" y="303" font-size="12" font-family="Menlo, Consolas, monospace" fill="#27500a">engine.active(...) → online → estado → sinais → alarme</text>
<text x="88" y="320" font-size="12" fill="#27500a">as 6 fases da imagem anterior</text>
<path d="M114 328V370" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="96" y="370" width="674" height="66" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="110" y="392" font-weight="bold" fill="#27500a">model.py  ·  Device._scan_signal(sig)</text>
<text x="110" y="411" font-size="12" font-family="Menlo, Consolas, monospace" fill="#27500a">if now &gt;= next_scan: value = nominal + ruído + drift</text>
<text x="110" y="428" font-size="12" fill="#27500a">só calcula se chegou o scan deste sinal; stuck não escreve, spike substitui</text>
<path d="M136 436V478" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="118" y="478" width="652" height="66" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="132" y="500" font-weight="bold" fill="#0c447c">model.py  ·  Device._write(name, value)</text>
<text x="132" y="519" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0c447c">raw = to_raw(...)  →  encode(...)  →  self.holding[addr] = word</text>
<text x="132" y="536" font-size="12" fill="#0c447c">5.07 bar  →  507  →  [0x01FB]  →  holding[0]</text>
<path d="M270 544V590" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="200" y="590" width="240" height="56" rx="8" fill="#fff" stroke="#27500a" stroke-width="2"/>
<text x="320" y="614" text-anchor="middle" font-weight="bold" fill="#27500a">device.holding[0] = 507</text>
<text x="320" y="633" text-anchor="middle" font-size="12" fill="#27500a">a tabela partilhada em memória</text>
<rect x="520" y="590" width="250" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="645" y="614" text-anchor="middle" font-weight="bold" fill="#0c447c">handle_pdu (outra thread)</text>
<text x="645" y="633" text-anchor="middle" font-size="12" fill="#0c447c">lê daqui, com o mesmo lock</text>
<path d="M520 618H442" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="30" y="718" font-size="11" fill="#444">O lock garante que o pedido nunca vê um dispositivo a meio de ser atualizado.</text>
</svg>
