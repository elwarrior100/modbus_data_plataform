<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 648" width="800" height="648" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="648" fill="#ffffff"/>
<text x="30" y="26" font-weight="bold" font-size="15" fill="#2c2c2a">Caminho de um pedido Modbus TCP (nada aqui calcula valores, só os lê)</text>
<rect x="30" y="44" width="740" height="72" rx="8" fill="#f1f1ee" stroke="#8a8a85"/>
<text x="46" y="68" font-weight="bold" fill="#2c2c2a">1. Cliente</text>
<text x="46" y="88" font-size="12" fill="#2c2c2a">pede o registo 0 da unidade 1 (a pressão da bomba)</text>
<text x="46" y="107" font-size="12" font-family="Menlo, Consolas, monospace" fill="#2c2c2a">00 01 00 00 00 06 01 | 03 00 00 00 01</text>
<path d="M400 116V142" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="142" width="740" height="72" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="46" y="166" font-weight="bold" fill="#0c447c">2. servers.py  client()</text>
<text x="46" y="186" font-size="12" fill="#0c447c">lê 7 bytes de cabeçalho e depois os 5 do corpo; não interpreta nada</text>
<text x="46" y="205" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0c447c">cabeçalho: 00 01 00 00 00 06 01     corpo: 03 00 00 00 01</text>
<path d="M400 214V240" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="240" width="740" height="72" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="46" y="264" font-weight="bold" fill="#27500a">3. modbus.py  handle_tcp_adu()</text>
<text x="46" y="284" font-size="12" fill="#27500a">tira o número da unidade (1) e entrega só o PDU</text>
<text x="46" y="303" font-size="12" font-family="Menlo, Consolas, monospace" fill="#27500a">unit = 1     pdu = 03 00 00 00 01</text>
<path d="M400 312V338" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="338" width="740" height="72" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="46" y="362" font-weight="bold" fill="#27500a">4. modbus.py  handle_pdu() &gt; _read_holding()</text>
<text x="46" y="382" font-size="12" fill="#27500a">vai à tabela buscar device.holding[0] = 500 e põe em 2 bytes</text>
<text x="46" y="401" font-size="12" font-family="Menlo, Consolas, monospace" fill="#27500a">resposta PDU: 03 02 01 F4        (0x01F4 = 500)</text>
<path d="M400 410V436" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="436" width="740" height="72" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="46" y="460" font-weight="bold" fill="#0c447c">5. servers.py</text>
<text x="46" y="480" font-size="12" fill="#0c447c">volta a pôr o cabeçalho (mesmo id de pedido) e envia</text>
<text x="46" y="499" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0c447c">00 01 00 00 00 05 01 | 03 02 01 F4</text>
<path d="M400 508V534" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="30" y="534" width="740" height="72" rx="8" fill="#f1f1ee" stroke="#8a8a85"/>
<text x="46" y="558" font-weight="bold" fill="#2c2c2a">6. Cliente</text>
<text x="46" y="578" font-size="12" fill="#2c2c2a">descodifica: 500 x 0.01 = 5.00 bar (a escala vem do mapa de registos)</text>
<text x="30" y="636" font-size="11" fill="#444">O 500 foi escrito antes, por outra thread (Device.step), no último scan deste sinal.</text>
</svg>
